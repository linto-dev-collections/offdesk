name: projects sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 送らずに、送る内容とトークンの通りだけ見る
        type: boolean
        default: true
      register_commands:
        description: 投入のあとに /offdesk を Discord へ登録し直す
        type: boolean
        default: false
      guild_id:
        description: 登録先のサーバー id（空ならグローバル。伝播に時間がかかる）
        type: string
        default: ""

concurrency:
  group: projects-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: projects.json を用意する
        env:
          PROJECTS_JSON: ${{ secrets.PROJECTS_JSON }}
        run: |
          if [ -z "${PROJECTS_JSON}" ]; then
            echo "secrets.PROJECTS_JSON が空です。gh secret set PROJECTS_JSON < projects.json" >&2
            exit 1
          fi
          printf '%s' "${PROJECTS_JSON}" > projects.json

      # **入力は env で渡す。** `${{ }}` を `run:` の中へ直に書くと、
      # 入力の文字列がシェルとして解釈される（`guild_id` は自由記述）。
      # GitHub の hardening ガイドが env 経由を指定している。
      - name: 投入する
        env:
          OFFDESK_URL: ${{ vars.OFFDESK_URL }}
          OFFDESK_TOKEN: ${{ secrets.OFFDESK_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # **送るのは "false" と読めたときだけ**（fail-closed）。
          # 逆に書くと、値が想定外だったときに「送らないつもりが送る」側へ倒れる。
          if [ "${DRY_RUN}" = "false" ]; then
            pnpm projects:sync
          else
            pnpm projects:sync -- --dry-run
          fi

      - name: /offdesk を登録し直す
        if: ${{ inputs.register_commands && !inputs.dry_run }}
        env:
          OFFDESK_URL: ${{ vars.OFFDESK_URL }}
          OFFDESK_TOKEN: ${{ secrets.OFFDESK_TOKEN }}
          GUILD_ID: ${{ inputs.guild_id }}
        run: |
          if [ -n "${GUILD_ID}" ]; then
            pnpm commands:register -- --guild "${GUILD_ID}"
          else
            pnpm commands:register
          fi

      - name: 後始末
        if: always()
        run: rm -f projects.json
