name: CI / Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip (unused deps / exports / files)
        run: pnpm knip

      - name: Biome (format + lint)
        run: pnpm format:ci

      - name: Type check
        run: pnpm check-types

      - name: Depcruise (dependency direction)
        run: pnpm depcruise

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 15
        run: pnpm run deploy
        env:
          ALCHEMY_DEPLOY: "1"
          ALCHEMY_STAGE: prod

          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          # P0 は Worker へ渡す環境変数が 0 個。フェーズごとにここへ足す。
          # 足す名前の正本は apps/app/src/worker/env.ts の PRODUCTION_REQUIRED_ENV_NAMES（alchemy.run.ts に同じ写しがある）。
          #   P1  BETTER_AUTH_SECRET / BETTER_AUTH_URL / GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / ALLOWED_LOGIN_EMAILS
          #   P2  DISCORD_BOT_TOKEN / DISCORD_PUBLIC_KEY / DISCORD_APPLICATION_ID / OWNER_DISCORD_USER_ID / FIRE_TOKEN_ENCRYPTION_KEY
          #   P3a MCP_BEARER_TOKEN
          #   P6  PLAN_LINK_SIGNING_KEY
