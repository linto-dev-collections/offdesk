name: CI / Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip (unused deps / exports / files)
        run: pnpm knip

      - name: Biome (format + lint)
        run: pnpm format:ci

      - name: Type check
        run: pnpm check-types

      - name: Depcruise (dependency direction)
        run: pnpm depcruise

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 15
        run: pnpm run deploy
        env:
          ALCHEMY_DEPLOY: "1"
          ALCHEMY_STAGE: prod

          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_ALLOWED_EMAILS: ${{ vars.AUTH_ALLOWED_EMAILS }}

          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          OWNER_DISCORD_USER_ID: ${{ vars.OWNER_DISCORD_USER_ID }}
          OFFDESK_TOKEN: ${{ secrets.OFFDESK_TOKEN }}
          FIRE_TOKEN_KEY: ${{ secrets.FIRE_TOKEN_KEY }}
          #   P6  PLAN_LINK_SIGNING_KEY
